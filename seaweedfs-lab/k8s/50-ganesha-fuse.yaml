# Additional comparison arm: Ganesha and the SeaweedFS FUSE gateway share a Pod.
# The host is the NFS client and runs fio. This requires a fixed MetalLB IP at
# 172.18.255.53 and Kubernetes mount-propagation support.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha-fuse-config
  namespace: seaweedfs
data:
  ganesha.conf: |
    NFS_CORE_PARAM {
        NFS_Port = 2049;
        RPC_Ioq_ThrdMin = 8;
        RPC_Ioq_ThrdMax = 64;
        RPC_Max_Connections = 1024;
        MaxRPCSendBufferSize = 1048576;
        MaxRPCRecvBufferSize = 1048576;
        Enable_UDP = false;
        Enable_TCP_keepalive = true;
        Protocols = 4;
        Enable_Metrics = false;
        Enable_Dynamic_Metrics = false;
    }

    NFSv4 {
        Lease_Lifetime = 10;
        Grace_Period = 10;
        minor_versions = 0,1;
        Delegations = false;
    }

    NFS_KRB5 {
        Active_krb5 = false;
    }

    DIRECTORY_SERVICES {
        DomainName = localdomain;
    }

    EXPORT {
        Export_Id = 1;
        Path = "/mnt/seaweedfs";
        Pseudo = "/seaweedfs";
        Access_Type = RW;
        Squash = Root_Squash;
        Protocols = 4;
        Transports = TCP;
        SecType = sys;
        MaxWrite = 1048576;
        MaxRead = 1048576;
        PrefWrite = 1048576;
        PrefRead = 1048576;
        PrefReaddir = 1048576;
        FSAL {
            Name = VFS;
        }
    }

    EXPORT_DEFAULTS {
        Access_Type = RW;
        Squash = Root_Squash;
        Protocols = 4;
        Transports = TCP;
        SecType = sys;
    }

    LOG {
        Facility {
            name = FILE;
            destination = "/var/log/ganesha/ganesha.log";
            enable = active;
        }
        Default_Log_Level = EVENT;
    }
  weed-mount-entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    SW_BIN=${SW_BIN:-/usr/local/bin/weed}
    FILER=${FILER:-172.18.255.52:19344}
    MNT=${MNT:-/mnt/seaweedfs}
    CACHE=${CACHE:-/cache}
    LOG=${LOG:-/var/log/weed-mount.log}
    mkdir -p "$MNT" "$CACHE"
    "$SW_BIN" mount -filer="$FILER" -dir="$MNT" -volumeName=seaweedfs-ganesha-pod -allowOthers=true -defaultPermissions=true -umask=022 -cacheDir="$CACHE" -cacheCapacityMB=128 -cacheMetaTtlSec=60 -chunkSizeLimitMB=2 -writeBufferSizeMB=4096 -concurrentWriters=128 -concurrentReaders=128 -metadataFlushSeconds=120 -fuse.maxBackground=128 -fuse.congestionThreshold=0 -df.logical -dlm >"$LOG" 2>&1 &
    mount_pid=$!
    cleanup() {
      kill "$mount_pid" 2>/dev/null || true
      wait "$mount_pid" 2>/dev/null || true
      fusermount3 -u -z "$MNT" 2>/dev/null || true
    }
    trap cleanup EXIT TERM INT
    for _ in $(seq 1 90); do
      if awk -v p="$MNT" '$2 == p && $3 == "fuse.seaweedfs" { found=1 } END { exit !found }' /proc/mounts; then
        wait "$mount_pid"
        exit $?
      fi
      if ! kill -0 "$mount_pid" 2>/dev/null; then
        cat "$LOG" >&2
        exit 1
      fi
      sleep 1
    done
    cat "$LOG" >&2
    exit 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-ganesha-fuse
  namespace: seaweedfs
  labels:
    app: seaweedfs-ganesha-fuse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs-ganesha-fuse
  template:
    metadata:
      labels:
        app: seaweedfs-ganesha-fuse
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fuse
          image: seaweedfs-lab:4.54
          imagePullPolicy: Never
          command:
            - /bin/bash
            - /work/weed-mount-entrypoint.sh
          env:
            - name: FILER
              value: "172.18.255.52:19344"
          securityContext:
            privileged: true
          volumeMounts:
            - name: fuse-device
              mountPath: /dev/fuse
            - name: export-path
              mountPath: /mnt/seaweedfs
              mountPropagation: Bidirectional
            - name: fuse-cache
              mountPath: /cache
            - name: fuse-entrypoint
              mountPath: /work/weed-mount-entrypoint.sh
              subPath: weed-mount-entrypoint.sh
            - name: fuse-logs
              mountPath: /var/log
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - "awk '$2 == \"/mnt/seaweedfs\" && $3 == \"fuse.seaweedfs\" { found=1 } END { exit !found }' /proc/mounts"
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
        - name: ganesha
          image: seaweedfs-lab:ganesha-v15.9
          imagePullPolicy: Never
          command:
            - /usr/local/bin/ganesha-entrypoint
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          volumeMounts:
            - name: ganesha-config
              mountPath: /etc/ganesha
              readOnly: true
            - name: export-path
              mountPath: /mnt/seaweedfs
              mountPropagation: HostToContainer
            - name: ganesha-logs
              mountPath: /var/log/ganesha
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
      volumes:
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: export-path
          emptyDir: {}
        - name: fuse-cache
          emptyDir: {}
        - name: fuse-logs
          emptyDir: {}
        - name: ganesha-logs
          emptyDir: {}
        - name: fuse-entrypoint
          configMap:
            name: ganesha-fuse-config
            defaultMode: 0755
            items:
              - key: weed-mount-entrypoint.sh
                path: weed-mount-entrypoint.sh
        - name: ganesha-config
          configMap:
            name: ganesha-fuse-config
            items:
              - key: ganesha.conf
                path: ganesha.conf
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-ganesha-fuse
  namespace: seaweedfs
  labels:
    app: seaweedfs-ganesha-fuse
spec:
  type: LoadBalancer
  # Reserve this address in the cluster's MetalLB pool before deploying.
  loadBalancerIP: 172.18.255.53
  selector:
    app: seaweedfs-ganesha-fuse
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
