# =====================================================================
# Host arm: Ganesha on the HOST, exporting the host's weed FUSE mount.
#
# This is the pod ConfigMap's NFS settings (40-ganesha-fuse.yaml) with
# only three differences:
#   * Path   is the host FUSE mount, not /mnt/seaweedfs in a container
#   * Pseudo is /seaweedfs-host, not /seaweedfs
#   * the log file lives on the host
#
# Keep every other NFS_CORE_PARAM, NFSv4 and EXPORT value in step with
# the pod's ConfigMap; the host-vs-pod comparison is about placement,
# not about different NFS tuning.
# =====================================================================
NFS_CORE_PARAM {
    NFS_Port = 2049;
    RPC_Ioq_ThrdMin = 8;
    # TIRPC ceiling, not a fixed count: ~91-95 I/O threads were created
    # under the 24 GiB / 2-job load.  200 is the documented default and
    # leaves headroom; the pod config uses the same value.
    RPC_Ioq_ThrdMax = 200;
    RPC_Max_Connections = 1024;
    MaxRPCSendBufferSize = 1048576;
    MaxRPCRecvBufferSize = 1048576;
    Enable_UDP = false;
    Enable_TCP_keepalive = true;
    Protocols = 4;
    Enable_Metrics = false;
    Enable_Dynamic_Metrics = false;
}

NFSv4 {
    Lease_Lifetime = 10;
    Grace_Period = 10;
    minor_versions = 0,1;
    Delegations = false;
}

NFS_KRB5 {
    Active_krb5 = false;
}

DIRECTORY_SERVICES {
    DomainName = localdomain;
}

EXPORT {
    Export_Id = 1;
    Path = "/home/ys1000/seaweedfs/mnt-k8s";
    Pseudo = "/seaweedfs-host";
    Access_Type = RW;
    Squash = Root_Squash;
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    MaxWrite = 1048576;
    MaxRead = 1048576;
    PrefWrite = 1048576;
    PrefRead = 1048576;
    PrefReaddir = 1048576;
    FSAL {
        Name = VFS;
    }
}

EXPORT_DEFAULTS {
    Access_Type = RW;
    Squash = Root_Squash;
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
}

LOG {
    Facility {
        name = FILE;
        destination = "/tmp/ganesha-host-arm.log";
        enable = active;
    }
    Default_Log_Level = EVENT;
}
