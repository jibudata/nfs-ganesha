# =====================================================================
# Ganesha + the SeaweedFS FUSE gateway, in one container.
#
# The mount and the NFS server share one mount namespace on purpose.  An
# earlier two-container layout (FUSE sidecar + Bidirectional propagation)
# never received the submount on Kind, so the two halves were collapsed
# into one image; see k8s/ganesha-entrypoint.sh and GANESHA-FUSE-POD.md.
#
# The filer is reached through the in-cluster Service DNS name.  The
# volume server's address never appears here: the filer returns the
# registered pod IP to the mount when it asks for a chunk, and pod IPs
# are routable from this pod.
#
# The Service is a NodePort for two reasons:
#   * no MetalLB (or any load-balancer controller) is required; the
#     cluster's node IP + 32049 is reachable from the host on Kind and
#     k3s alike, and in-cluster clients can use the ClusterIP:2049;
#   * it is not a SeaweedFS Service, so the gRPC-port rules for the
#     SeaweedFS LoadBalancer Services do not apply to it.
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha-fuse-config
  namespace: ganesha-seaweedfs
data:
  ganesha.conf: |
    NFS_CORE_PARAM {
        NFS_Port = 2049;
        RPC_Ioq_ThrdMin = 8;
        RPC_Ioq_ThrdMax = 16;
        RPC_Max_Connections = 1024;
        MaxRPCSendBufferSize = 1048576;
        MaxRPCRecvBufferSize = 1048576;
        Enable_UDP = false;
        Enable_TCP_keepalive = true;
        Protocols = 4;
        Enable_Metrics = false;
        Enable_Dynamic_Metrics = false;
    }

    NFSv4 {
        Lease_Lifetime = 10;
        Grace_Period = 10;
        minor_versions = 0,1;
        Delegations = false;
    }

    NFS_KRB5 {
        Active_krb5 = false;
    }

    DIRECTORY_SERVICES {
        DomainName = localdomain;
    }

    EXPORT {
        Export_Id = 1;
        Path = "/mnt/seaweedfs";
        Pseudo = "/seaweedfs";
        Access_Type = RW;
        Squash = Root_Squash;
        Protocols = 4;
        Transports = TCP;
        SecType = sys;
        MaxWrite = 1048576;
        MaxRead = 1048576;
        PrefWrite = 1048576;
        PrefRead = 1048576;
        PrefReaddir = 1048576;
        FSAL {
            Name = VFS;
        }
    }

    EXPORT_DEFAULTS {
        Access_Type = RW;
        Squash = Root_Squash;
        Protocols = 4;
        Transports = TCP;
        SecType = sys;
    }

    LOG {
        Facility {
            name = FILE;
            destination = "/var/log/ganesha/ganesha.log";
            enable = active;
        }
        Default_Log_Level = EVENT;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-ganesha-fuse
  namespace: ganesha-seaweedfs
  labels:
    app: seaweedfs-ganesha-fuse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs-ganesha-fuse
  template:
    metadata:
      labels:
        app: seaweedfs-ganesha-fuse
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ganesha-fuse
          image: seaweedfs-lab:ganesha-v15.9
          imagePullPolicy: Never
          command:
            - /usr/local/bin/ganesha-entrypoint
          env:
            - name: FILER
              value: "seaweedfs-filer.ganesha-seaweedfs.svc.cluster.local:8888"
            # The export is Root_Squash, so the FUSE root (owned by root,
            # mode 0755) is not writable by an NFS client.  The entrypoint
            # creates this subdirectory and makes it world-writable after
            # the mount is up; write tests into /data.  The FUSE root
            # itself rejects setattr (EAGAIN), hence a fresh subdirectory.
            - name: EXPORT_SUBDIR
              value: "data"
          securityContext:
            # weed mount needs /dev/fuse and CAP_SYS_ADMIN.
            privileged: true
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          volumeMounts:
            - name: fuse-device
              mountPath: /dev/fuse
            - name: export-path
              mountPath: /mnt/seaweedfs
            - name: fuse-cache
              mountPath: /cache
            - name: fuse-logs
              mountPath: /var/log
            - name: ganesha-config
              mountPath: /etc/ganesha
              readOnly: true
          readinessProbe:
            # Ready means "actually serving": the FUSE mount exists AND
            # Ganesha accepts on 2049.  A mount-only probe marks the pod
            # Ready while Ganesha is still initialising, and the Service
            # then hands NFS clients to a server that refuses them.
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  awk '$2 == "/mnt/seaweedfs" && $3 == "fuse.seaweedfs" { found=1 } END { exit !found }' /proc/mounts
                  timeout 2 bash -c '</dev/tcp/127.0.0.1/2049'
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Ganesha is supervised by the entrypoint; this catches a
            # server that is up but no longer answering NFS.
            tcpSocket:
              port: nfs
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice
        # The mount point, the chunk cache and the logs are the FUSE
        # layer's own state; the data itself is in the volume PVC.
        - name: export-path
          emptyDir: {}
        - name: fuse-cache
          emptyDir: {}
        - name: fuse-logs
          emptyDir: {}
        - name: ganesha-config
          configMap:
            name: ganesha-fuse-config
            items:
              - key: ganesha.conf
                path: ganesha.conf
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-ganesha-fuse
  namespace: ganesha-seaweedfs
  labels:
    app: seaweedfs-ganesha-fuse
spec:
  type: NodePort
  selector:
    app: seaweedfs-ganesha-fuse
  ports:
    - name: nfs
      port: 2049
      targetPort: nfs
      # Fixed so a host-side mount command stays stable across redeploys.
      nodePort: 32049
      protocol: TCP
