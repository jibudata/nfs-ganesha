# =====================================================================
# SeaweedFS master for the ganesha-seaweedfs test stack.
#
# This is a SHARED BACKEND for two Ganesha/FUSE arms: one in a pod and
# one on the host.  The host's FUSE mount must reach the filer and the
# volume server, so all three components advertise the NODE IP and
# publish their real ports as hostPorts:
#
#   master  172.18.0.2:9333 / 19333
#   filer   172.18.0.2:8888 / 18888
#   volume  172.18.0.2:8080 / 18080
#
# No MetalLB/LoadBalancer is involved in the data path.  hostPort also
# keeps SeaweedFS's gRPC = HTTP + 10000 convention intact, which a
# NodePort translation would break.  Both the host and pods reach the
# node IP, so one backend serves both arms.  The Services stay ClusterIP
# for in-cluster health/status.
#
# -vacuumIntervalSeconds=86400 keeps the automatic volume sweep out of a
# test run; a sweep rewrites whole volumes and resets in-flight chunk
# uploads (R11).  deploy also turns the sweep off at runtime.
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-master-data
  namespace: ganesha-seaweedfs
  labels:
    app: seaweedfs-master
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-master
  namespace: ganesha-seaweedfs
  labels:
    app: seaweedfs-master
spec:
  replicas: 1
  # Recreate: two masters on one metadata directory would fight over it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs-master
  template:
    metadata:
      labels:
        app: seaweedfs-master
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: master
          image: seaweedfs-lab:4.54
          # The image is built from the lab host's own binary and imported
          # into the node's containerd; there is no registry to pull from.
          imagePullPolicy: Never
          command:
            - /usr/local/bin/weed
            - master
          args:
            # The address the filer and the volume server dial.
            - -ip=172.18.0.2
            - -ip.bind=0.0.0.0
            - -port=9333
            - -port.grpc=19333
            - -mdir=/data/master
            - -peers=none
            - -vacuumIntervalSeconds=86400
            - -telemetry=false
            # 4 GiB volumes: the host-side benchmark writes past 5 GiB so
            # the data has to span multiple volume files.  The master
            # pre-creates the writable pool, so this caps each file at
            # 4 GiB rather than serialising the writes.
            - -volumeSizeLimitMB=4096
          ports:
            - name: http
              containerPort: 9333
              hostPort: 9333
            - name: grpc
              containerPort: 19333
              hostPort: 19333
          volumeMounts:
            - name: master-data
              mountPath: /data/master
          # A TCP probe, not an HTTP one: the master has no single health
          # path that stays stable across releases.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # CPU limit removed for the sustained-write tuning; the node
            # has 16 vCPUs and the master was capped at 1.
            limits:
              memory: 1Gi
      volumes:
        - name: master-data
          persistentVolumeClaim:
            claimName: seaweedfs-master-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: ganesha-seaweedfs
  labels:
    app: seaweedfs-master
spec:
  selector:
    app: seaweedfs-master
  ports:
    - name: http
      port: 9333
      targetPort: http
    - name: grpc
      port: 19333
      targetPort: grpc
