# =====================================================================
# NFS-Ganesha V15.9 -- exports the SeaweedFS FUSE mount
#   target host : ys1000@192.168.3.146
#   FUSE mount  : /home/ys1000/seaweedfs/mnt  (fuse.seaweedfs, SeaweedFS 4.54)
#   data path   : NFS client -> Ganesha(FSAL_VFS) -> FUSE -> filer -> volume server
#
# Every token below was verified against the V15.9 source tree
#   /home/ys1000/src/github.com/nfs-ganesha/nfs-ganesha  (branch `v15.9`)
#
#   NOTE: V15.9 has NO "Nb_Worker" option. The NFS request threads ARE the
#   TIRPC I/O threads -> RPC_Ioq_ThrdMin .. RPC_Ioq_ThrdMax.
#   "-N" on the ganesha.nfsd command line is the DEBUG LEVEL, not a worker count.
# =====================================================================

NFS_CORE_PARAM {
    NFS_Port = 2049;

    # --- request-processing concurrency -----------------------------------
    # TIRPC I/O threads that execute NFS requests.
    #   V15.9 defaults: Min=2, Max=200 (auto-grows toward Max under load)
    RPC_Ioq_ThrdMin = 8;
    RPC_Ioq_ThrdMax = 64;

    RPC_Max_Connections = 1024;

    # --- socket buffers ----------------------------------------------------
    # default 1 MiB each; compare 1/4/8 MiB before raising
    MaxRPCSendBufferSize = 1048576;
    MaxRPCRecvBufferSize = 1048576;

    # --- observability overhead -------------------------------------------
    # default is TRUE and it costs measurable throughput -- benchmark both
    Enable_Dynamic_Metrics = false;
    Enable_Metrics = true;
    Monitoring_Port = 32000;

    # Bind the Prometheus endpoint explicitly. Unset, it defaults to 0.0.0.0,
    # which the startup code reads as "not set" and replaces with Bind_Addr -
    # so LAN reachability currently depends on two defaults lining up.
    # 0.0.0.0 (all interfaces) is kept on purpose: the exporter PEXIT()s when
    # bind() fails, so a specific address would let a missing interface take
    # Ganesha down at startup. The endpoint also listens on the docker
    # bridges; scope it with a firewall rule if that matters here.
    Monitoring_Addr = 0.0.0.0;

    # --- protocol / locking ------------------------------------------------
    Enable_NLM = true;        # NLMv4 + NFSv4 lock manager (needs fcntl on the FUSE mount)
    Protocols = 4, 3;

    # --- readdir / getattr micro-optimisations ----------------------------
    Readdir_Res_Size = 131072;
    Readdir_Max_Count = 4096;
    Getattrs_In_Complete_Read = true;

    # AUTH_SYS only: never fall back to an extra RPC round-trip to fetch
    # credentials (V15.9 default is already false; kept explicit).
    enable_rpc_cred_fallback = false;

    # --- housekeeping -------------------------------------------------------
    Enable_UDP = false;       # TCP only
    Enable_TCP_keepalive = true;
    Drop_IO_Errors = false;
}

NFSv4 {
    Lease_Lifetime = 10;
    Grace_Period = 10;

    # --- pin the minor version --------------------------------------------
    # Bitmask, 1 << minor: 0=NFSv4.0, 1=NFSv4.1, 2=NFSv4.2.
    # V15.9 default is NFSV4_MINOR_VERSION_ALL (v4.0 + v4.1 + v4.2).
    # "0,1" allows v4.0 and v4.1 and rejects v4.2 with NFS4ERR_MINOR_VERS_MISMATCH
    # (src/Protocols/NFS/nfs4_Compound.c).
    # v4.1 is the conservative choice: mature, widest client compatibility, and
    # no generic throughput advantage for v4.2 without server-side copy etc.
    minor_versions = 0,1;

    # Delegations default false in V15.9; enable only if clients need them
    Delegations = false;
    Max_Copy_Workers = 8;
}

# RPCSEC_GSS is compiled in, but this lab uses AUTH_SYS only.
# Active_krb5 defaults to TRUE, and Ganesha then aborts at startup with
# "Cannot acquire credentials for principal nfs" when no keytab/KDC exists.
NFS_KRB5 {
    Active_krb5 = false;
}

# NFSv4 id mapping domain (otherwise libnfsidmap falls back to "localdomain"
# and maps every uid to Nobody-User)
DIRECTORY_SERVICES {
    DomainName = localdomain;
}

EXPORT {
    Export_Id = 1;

    # the SeaweedFS FUSE mount
    Path = "/home/ys1000/seaweedfs/mnt";
    Pseudo = "/seaweedfs";

    Access_Type = RW;
    Squash = Root_Squash;
    Protocols = 4, 3;
    Transports = TCP;
    SecType = sys, none;

    # transfer sizes -- must not exceed what the client negotiates
    MaxWrite = 1048576;
    MaxRead  = 1048576;
    PrefWrite = 1048576;
    PrefRead  = 1048576;
    PrefReaddir = 1048576;

    FSAL {
        Name = VFS;
    }
}

# --- lab-only control export: plain local ext4, NO FUSE in the path -------
# Same Ganesha, same client, same fio workload -- but the backing store is a
# normal local ext4 directory instead of the SeaweedFS FUSE mount.
# This is what isolates "NFS + Ganesha" cost from "FUSE/SeaweedFS" cost.
# Measured on this host: O_DIRECT 1 MiB writes
#   -> export 1 (FUSE):  104 MiB/s   (one fsync(2) per write, each flushes a
#                                     SeaweedFS chunk to the volume server)
#   -> export 2 (ext4):  719 MiB/s   (same fsync per write, but ext4's fsync
#                                     on NVMe is ~1.4 ms instead of ~150 ms)
# Keep this export only for the lab; remove it in production.
EXPORT {
    Export_Id = 2;
    Path = "/home/ys1000/ganesha-local-ext4";
    Pseudo = "/local-ext4";

    Access_Type = RW;
    Squash = Root_Squash;
    Protocols = 4, 3;
    Transports = TCP;
    SecType = sys, none;

    MaxWrite = 1048576;
    MaxRead  = 1048576;
    PrefWrite = 1048576;
    PrefRead  = 1048576;
    PrefReaddir = 1048576;

    FSAL {
        Name = VFS;
    }
}

EXPORT_DEFAULTS {
    Access_Type = RW;
    Squash = Root_Squash;
    Protocols = 4, 3;
    Transports = TCP;
    SecType = sys;
}

LOG {
    Facility {
        name = FILE;
        destination = "/var/log/ganesha/ganesha.log";
        enable = active;
    }
    Default_Log_Level = EVENT;
}

# --- lab-only export: the HDD-tier SeaweedFS cluster -----------------------
